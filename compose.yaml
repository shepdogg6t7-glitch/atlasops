services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atlasops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    container_name: atlasops-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: quay.io/minio/minio:latest
    container_name: atlasops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.5@sha256:badca2d958f81da675c3055a9ecb6ebb590325582bcf16936148ffd65e96e920
    container_name: atlasops-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: atlasops-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      redpanda:
        condition: service_started
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      API_PORT: "8000"
      API_BASE_URL: http://localhost:8000
      CORS_ORIGIN: http://localhost:3000
      ALLOW_REGISTRATION: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      KAFKA_BROKERS: redpanda:9092
      REDPANDA_BOOTSTRAP: redpanda:9092
      KAFKA_CLIENT_ID: atlasops-local
      JWT_SECRET: ${JWT_SECRET}
      MAX_UPLOAD_MB: "25"

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: atlasops-worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    command: python apps/api/consumer.py
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PYTHONPATH: /app
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      KAFKA_BROKERS: redpanda:9092
      REDPANDA_BOOTSTRAP: redpanda:9092
      KAFKA_CLIENT_ID: atlasops-local
      MAX_UPLOAD_MB: "25"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: atlasops-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8001

volumes:
  postgres-data:
  redis-data:
  minio-data:
  redpanda-data:
