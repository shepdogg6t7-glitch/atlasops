name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlasops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlasops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atlasops
      JWT_SECRET: test-secret-key-that-is-at-least-32-chars-long
    steps:
      - uses: actions/checkout@v4

      # --- Backend ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Enable pgvector extension
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d atlasops -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run backend tests
        run: python -m pytest apps/api/tests -v

      # --- Frontend ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web

      - name: Lint frontend
        run: npm run lint
        working-directory: apps/web

      - name: Type-check frontend
        run: npx tsc --noEmit
        working-directory: apps/web

      - name: Build frontend
        run: npm run build
        working-directory: apps/web

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build api, worker, and web images
        run: docker compose build api worker web

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Run pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit -r apps/api/requirements.txt --desc on

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        working-directory: apps/web

      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml
